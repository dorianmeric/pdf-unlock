# Template — copy as-is or adjust. Run with:
#   docker compose up -d --build
# Then open http://localhost:8080
services:
  pdf-unlock:
    build:
      context: .
      dockerfile: Dockerfile
    #image: pdf-unlock:latest
    container_name: pdf-unlock

    # host:container — change only the left side
    ports:
      - "8191:8191"

    restart: unless-stopped

    # Static files only: the container never needs to write to its own filesystem.
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true

    # All PDF processing happens in the visitor's browser, so the container is
    # stateless and needs no volumes, env vars, or database.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - caddy-network

networks:
  caddy-network:
    name: caddy-network
    external: true

