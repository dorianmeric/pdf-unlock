# Template — copy as-is or adjust. Run with:
#   docker compose up -d --build
# Then open http://localhost:8191
#
# Ports are configurable from the environment (=.env or shell):
#   HOST_PORT=8191          host port published by docker
#   CONTAINER_PORT=8191     port nginx listens on inside the container (PORT)
#   HOST_PORT=9000 CONTAINER_PORT=8080 docker compose up -d
services:
  pdf-unlock:
    build:
      context: .
      dockerfile: Dockerfile
    #image: pdf-unlock:latest
    container_name: pdf-unlock

    environment:
      # Port nginx listens on inside the container; the config template is
      # rendered with this value on every start.
      PORT: "${CONTAINER_PORT:-8191}"

    # host:container
    ports:
      - "${HOST_PORT:-8191}:${CONTAINER_PORT:-8191}"

    restart: unless-stopped

    # Static files only: nothing is persisted, so the root filesystem stays
    # read-only and only scratch paths get tmpfs mounts.
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
      # The entrypoint renders the port template into this directory, so it has
      # to be writable even though the rest of the filesystem is read-only.
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true

    # All PDF processing happens in the visitor's browser, so the container is
    # stateless and needs no volumes or database.
    healthcheck:
      # $$ escapes compose interpolation so the shell inside the container
      # expands PORT at runtime.
      test: ["CMD-SHELL", "wget -q --spider \"http://127.0.0.1:$${PORT}/\" || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - caddy-network

networks:
  caddy-network:
    name: caddy-network
    external: true

